name: Build and verify theme packages
description: Shared Windows validation for pull requests and release candidates
inputs:
  report-artifact:
    description: Artifact name for generated validation reports
    required: true
  report-retention-days:
    description: Retention period for generated validation reports
    required: true

runs:
  using: composite
  steps:
    - name: Set up Node.js 22
      uses: actions/setup-node@v6
      with:
        node-version: 22
        cache: npm
    - name: Install dependencies
      shell: pwsh
      run: npm ci
    - name: Check JavaScript syntax
      shell: pwsh
      run: npm run lint
    - name: Run unit tests
      shell: pwsh
      run: npm test
    - name: Build eight theme packages
      shell: pwsh
      run: npm run build
    - name: Verify packages and archive operations
      shell: pwsh
      run: npm run verify
    - name: Run mandatory Options tab UI smoke (x86/x64 matrix)
      shell: pwsh
      run: ./scripts/gui-smoke.ps1
    - name: Generate visual reports
      shell: pwsh
      run: npm run report
    - name: Stage binaries for malware scan
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force -Path clamav-input/packages, clamav-input/dist, clamav-input/tools | Out-Null
        Copy-Item -Path .build/packages/* -Destination clamav-input/packages -Recurse -Force
        Copy-Item -Path dist/* -Destination clamav-input/dist -Force
        Copy-Item -LiteralPath .cache/upstream/7zr.exe -Destination clamav-input/tools/7zr.exe
    - name: Upload binaries for malware scan
      uses: actions/upload-artifact@v7
      with:
        name: scan-input-${{ github.sha }}
        path: clamav-input/**
        if-no-files-found: error
        retention-days: 90
    - name: Upload validation reports
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.report-artifact }}
        path: reports/generated/
        if-no-files-found: warn
        retention-days: ${{ inputs.report-retention-days }}
