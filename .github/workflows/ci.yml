name: CI - Pull request checks

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  build:
    name: Build and test themes (Windows x86/x64)
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Check out pull request
        uses: actions/checkout@v6
      - name: Build and verify themes
        uses: ./.github/actions/build-verify
        with:
          report-artifact: compatibility-reports-${{ github.sha }}
          report-retention-days: '30'

  clamav:
    name: Scan packages for malware
    needs: build
    uses: ./.github/workflows/clamav-scan.yml
