name: CI - Pull request checks

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  build:
    name: Build and test themes (Windows x86/x64)
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Check out pull request
        uses: actions/checkout@v4
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check JavaScript syntax
        run: npm run lint
      - name: Run unit tests
        run: npm test
      - name: Build eight theme packages
        run: npm run build
      - name: Verify packages and archive operations
        run: npm run verify
      - name: Check File Manager window (x86/x64)
        shell: pwsh
        run: ./scripts/gui-smoke.ps1
      - name: Generate visual reports
        run: npm run report
      - name: Stage binaries for malware scan
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path clamav-input/packages, clamav-input/dist | Out-Null
          Copy-Item -Path .build/packages/* -Destination clamav-input/packages -Recurse -Force
          Copy-Item -Path dist/* -Destination clamav-input/dist -Force
      - name: Upload binaries for malware scan
        uses: actions/upload-artifact@v4
        with:
          name: scan-input-${{ github.sha }}
          path: clamav-input/**
          if-no-files-found: error
          retention-days: 90
      - name: Upload CI reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compatibility-reports-${{ github.sha }}
          path: reports/generated/
          if-no-files-found: warn
          retention-days: 30

  clamav:
    name: Scan packages for malware
    needs: build
    uses: ./.github/workflows/clamav-scan.yml
