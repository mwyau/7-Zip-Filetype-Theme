name: Maintenance - Check for new 7-Zip versions

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Check official 7-Zip release
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      update: ${{ steps.upstream.outputs.update }}
      version: ${{ steps.upstream.outputs.version }}
    steps:
      - name: Check out master
        uses: actions/checkout@v6
        with:
          ref: master
      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Compare release with pinned version
        id: upstream
        run: npm run check-upstream
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Upload proposed upstream release lock
        if: steps.upstream.outputs.update == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: proposed-7zip-${{ steps.upstream.outputs.version }}-lock
          path: config/7zip.lock.json
          if-no-files-found: error
          retention-days: 30

  compatibility-pr:
    name: Open upstream compatibility PR
    needs: check
    if: needs.check.outputs.update == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out master
        uses: actions/checkout@v6
        with:
          ref: master
      - name: Download proposed upstream release lock
        uses: actions/download-artifact@v7
        with:
          name: proposed-7zip-${{ needs.check.outputs.version }}-lock
          path: config
      - name: Create or update compatibility PR
        id: pr
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ github.token }}
          base: master
          branch: update/7zip-${{ needs.check.outputs.version }}
          add-paths: config/7zip.lock.json
          commit-message: 'Pin official 7-Zip ${{ needs.check.outputs.version }}'
          title: 'Update theme packages for 7-Zip ${{ needs.check.outputs.version }}'
          body: |
            Pins the official [7-Zip ${{ needs.check.outputs.version }} release](https://github.com/ip7z/7zip/releases/tag/${{ needs.check.outputs.version }}) and its x86/x64 download hashes in `config/7zip.lock.json`.

            The theme build is a complete rewrite in Node.js and PowerShell using the original icon and toolbar artwork. This PR updates the official binary inputs, not the artwork or build tools.

            **Required before merging**
            - Windows x86/x64: build all eight archives, verify modified resources, and run archive and File Manager smoke tests.
            - ClamAV: scan the built binaries and archives.
            - Review the resource-diff report and icon and Ribbon previews.

            GitHub may require **Approve workflows to run** for a PR created by `GITHUB_TOKEN`. After merging, the release workflow validates the merged commit again. Publication requires approval of the protected `release` environment.
          draft: false
      - name: Explain CI approval required for bot PRs
        if: steps.pr.outputs.pull-request-number != ''
        env:
          PR_URL: ${{ steps.pr.outputs.pull-request-url }}
        run: |
          {
            echo "### Upstream compatibility PR"
            echo
            echo "PR: $PR_URL"
            echo
            echo "Created with the built-in GitHub Actions token. GitHub may require a maintainer to select **Approve workflows to run** before PR CI starts."
            echo "The PR must pass Windows build, package verification, GUI smoke tests, and ClamAV before merge."
          } >> "$GITHUB_STEP_SUMMARY"
