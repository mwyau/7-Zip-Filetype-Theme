name: Maintenance - Check for new 7-Zip versions

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Check official 7-Zip release
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      update: ${{ steps.upstream.outputs.update }}
      version: ${{ steps.upstream.outputs.version }}
    steps:
      - name: Check out master
        uses: actions/checkout@v6
        with:
          ref: master
      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Compare release with pinned version
        id: upstream
        run: npm run check-upstream
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Upload proposed upstream release lock
        if: steps.upstream.outputs.update == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: proposed-7zip-${{ steps.upstream.outputs.version }}-lock
          path: config/7zip.lock.json
          if-no-files-found: error
          retention-days: 30

  compatibility-pr:
    name: Open upstream compatibility PR
    needs: check
    if: needs.check.outputs.update == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out master
        uses: actions/checkout@v6
        with:
          ref: master
      - name: Download proposed upstream release lock
        uses: actions/download-artifact@v7
        with:
          name: proposed-7zip-${{ needs.check.outputs.version }}-lock
          path: config
      - name: Create or update compatibility PR
        id: pr
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ github.token }}
          base: master
          branch: update/7zip-${{ needs.check.outputs.version }}
          add-paths: config/7zip.lock.json
          commit-message: 'Update official 7-Zip lock to ${{ needs.check.outputs.version }}'
          title: 'Update 7-Zip themes to ${{ needs.check.outputs.version }}'
          body: |
            Updates the pinned upstream release to official 7-Zip ${{ needs.check.outputs.version }}.

            - Upstream release: https://github.com/ip7z/7zip/releases/tag/${{ needs.check.outputs.version }}
            - Matrix: Windows x86/x64; Windows 10, Fluent, Fluent Blue filetypes, and Windows 11 Ribbon
            - Resource compatibility and archive tests: pending required CI
            - ClamAV: required after the complete Windows build
            - Visual contact sheets and resource-diff report: uploaded by compatibility CI
            - CI approval: select **Approve workflows to run** on this PR when prompted by GitHub
            - Manual review: inspect all compatibility checks and visually inspect the GUI before merging

            This PR is not auto-merged. Incompatible releases remain visible with CI diagnostics.
          draft: false
      - name: Explain CI approval required for bot PRs
        if: steps.pr.outputs.pull-request-number != ''
        env:
          PR_URL: ${{ steps.pr.outputs.pull-request-url }}
        run: |
          {
            echo "### Upstream compatibility PR"
            echo
            echo "PR: $PR_URL"
            echo
            echo "Created with the built-in GitHub Actions token. GitHub may require a maintainer to select **Approve workflows to run** before PR CI starts."
            echo "The PR must pass Windows build, package verification, GUI smoke tests, and ClamAV before merge."
          } >> "$GITHUB_STEP_SUMMARY"
