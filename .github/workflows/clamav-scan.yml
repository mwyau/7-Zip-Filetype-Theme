name: Security - Windows ClamAV scan (reusable)

on:
  workflow_call:

permissions:
  actions: read
  contents: read

jobs:
  scan:
    name: Scan binaries and archives
    runs-on: windows-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Initialize failure-safe scan report
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path clamav-report | Out-Null
          $report = [ordered]@{
            generatedAt = [DateTime]::UtcNow.ToString('o')
            engineVersion = $null
            signatureUpdate = $null
            databases = [ordered]@{}
            fileCount = 0
            scanExitCode = $null
            scanSummary = $null
            verdict = 'FAILED'
            error = 'ClamAV setup or scan did not complete'
            files = @()
          }
          $report | ConvertTo-Json -Depth 8 | Set-Content -Path clamav-report/report.json -Encoding utf8
          Set-Content -Path clamav-report/report.md -Encoding utf8 -Value @'
          # ClamAV scan report

          - Verdict: **FAILED**
          - Error: ClamAV setup or scan did not complete.
          '@
      - name: Check out security scripts
        uses: actions/checkout@v6
      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Download exact build artifacts
        uses: actions/download-artifact@v7
        with:
          name: scan-input-${{ github.sha }}
          path: scan-input
      - name: Set up official portable ClamAV
        shell: pwsh
        run: |
          $scannerDirectory = & ./scripts/setup-clamav-windows.ps1 | Select-Object -Last 1
          "CLAMAV_DIRECTORY=$scannerDirectory" >> $env:GITHUB_ENV
      - name: Update signatures and scan packages
        shell: pwsh
        run: |
          $databaseDirectory = Join-Path $env:RUNNER_TEMP 'clamav/database'
          node scripts/clamav-scan.mjs --root scan-input --report clamav-report/report.json --clamav-dir $env:CLAMAV_DIRECTORY --database-dir $databaseDirectory --sevenzip scan-input/tools/7zr.exe
      - name: Upload scan audit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: clamav-report-${{ github.sha }}
          path: |
            clamav-report/report.json
            clamav-report/report.md
          if-no-files-found: error
          retention-days: 90
