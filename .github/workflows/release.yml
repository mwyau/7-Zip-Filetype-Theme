name: Release - Validate and publish

on:
  push:
    branches: [master]
    paths-ignore:
      - 'README.md'
      - 'AGENTS.md'
      - 'docs/**'
      - 'assets/**/info/**'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: theme-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Check release eligibility
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      proceed: ${{ steps.check.outputs.proceed }}
    steps:
      - name: Check out release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check existing tag and release assets
        id: check
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/release-preflight.mjs

  validate:
    name: Build and test release (Windows x86/x64)
    needs: preflight
    if: github.ref == 'refs/heads/master' && needs.preflight.outputs.proceed == 'true'
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Check out release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Verify commit is current master
        shell: pwsh
        run: |
          git fetch origin master
          if ((git rev-parse origin/master) -ne $env:GITHUB_SHA) { throw 'Validated commit is not current master.' }
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check JavaScript syntax
        run: npm run lint
      - name: Run unit tests
        run: npm test
      - name: Build eight theme packages
        run: npm run build
      - name: Verify packages and archive operations
        run: npm run verify
      - name: Run mandatory Options tab UI smoke (x86/x64 matrix)
        shell: pwsh
        run: ./scripts/gui-smoke.ps1
      - name: Generate visual reports
        run: npm run report
      - name: Stage binaries for malware scan
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path clamav-input/packages, clamav-input/dist, clamav-input/tools | Out-Null
          Copy-Item -Path .build/packages/* -Destination clamav-input/packages -Recurse -Force
          Copy-Item -Path dist/* -Destination clamav-input/dist -Force
          Copy-Item -LiteralPath .cache/upstream/7zr.exe -Destination clamav-input/tools/7zr.exe
      - name: Upload binaries for malware scan
        uses: actions/upload-artifact@v4
        with:
          name: scan-input-${{ github.sha }}
          path: clamav-input/**
          if-no-files-found: error
          retention-days: 90
      - name: Upload release reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-reports-${{ github.sha }}
          path: reports/generated/
          if-no-files-found: warn
          retention-days: 90

  clamav:
    name: Scan release packages for malware
    needs: validate
    uses: ./.github/workflows/clamav-scan.yml

  approval_config:
    name: Verify release approval policy
    needs: [validate, clamav]
    if: github.ref == 'refs/heads/master' && needs.validate.result == 'success' && needs.clamav.result == 'success'
    runs-on: ubuntu-26.04
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check required reviewer and bypass policy
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/verify-release-environment.mjs

  publish:
    name: Publish approved release
    needs: [validate, clamav, approval_config]
    if: github.ref == 'refs/heads/master' && needs.validate.result == 'success' && needs.clamav.result == 'success' && needs.approval_config.result == 'success'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      actions: read
      contents: write
    steps:
      - name: Check out release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Recheck release approval policy
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/verify-release-environment.mjs
      - name: Download validated packages
        uses: actions/download-artifact@v4
        with:
          name: scan-input-${{ github.sha }}
          path: release-input
      - name: Download malware scan report
        uses: actions/download-artifact@v4
        with:
          name: clamav-report-${{ github.sha }}
          path: clamav-report
      - name: Determine release tag
        id: release
        shell: pwsh
        run: |
          $lock = Get-Content -Raw config/7zip.lock.json | ConvertFrom-Json
          $metadata = Get-Content -Raw config/release.json | ConvertFrom-Json
          "RELEASE_TAG=7zip-$($lock.version)-theme.$($metadata.themeRevision)" >> $env:GITHUB_ENV
      - name: Verify checksums and publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
        run: ./scripts/publish-release.ps1
