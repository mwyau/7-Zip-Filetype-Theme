name: Validated 7-Zip theme release

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: theme-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Build and acceptance validation
    if: github.ref == 'refs/heads/master'
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Confirm this commit is current master
        shell: pwsh
        run: |
          git fetch origin master
          if ((git rev-parse origin/master) -ne $env:GITHUB_SHA) { throw 'Validated commit is not current master.' }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run verify
      - run: npm run report
      - name: Stage exact ClamAV and release inputs
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path clamav-input/packages, clamav-input/dist | Out-Null
          Copy-Item -Path .build/packages/* -Destination clamav-input/packages -Recurse -Force
          Copy-Item -Path dist/* -Destination clamav-input/dist -Force
      - name: Upload immutable build outputs for scanning and release
        uses: actions/upload-artifact@v4
        with:
          name: scan-input-${{ github.sha }}
          path: clamav-input/**
          if-no-files-found: error
          retention-days: 90
      - name: Upload visual reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-reports-${{ github.sha }}
          path: reports/generated/
          if-no-files-found: warn
          retention-days: 90

  clamav:
    name: Mandatory ClamAV security gate
    needs: validate
    uses: ./.github/workflows/clamav-scan.yml

  approval_config:
    name: Verify owner approval protection
    needs: [validate, clamav]
    if: github.ref == 'refs/heads/master' && needs.validate.result == 'success' && needs.clamav.result == 'success'
    runs-on: ubuntu-26.04
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Require owner approval with administrator bypass disabled
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/verify-release-environment.mjs

  publish:
    name: Publish approved release
    needs: [validate, clamav, approval_config]
    if: github.ref == 'refs/heads/master' && needs.validate.result == 'success' && needs.clamav.result == 'success' && needs.approval_config.result == 'success'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Recheck approval protection before publication
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/verify-release-environment.mjs
      - uses: actions/download-artifact@v4
        with:
          name: scan-input-${{ github.sha }}
          path: release-input
      - uses: actions/download-artifact@v4
        with:
          name: clamav-report-${{ github.sha }}
          path: clamav-report
      - name: Derive upstream version and theme revision
        id: release
        shell: pwsh
        run: |
          $lock = Get-Content -Raw config/7zip.lock.json | ConvertFrom-Json
          $metadata = Get-Content -Raw config/release.json | ConvertFrom-Json
          "RELEASE_TAG=7zip-$($lock.version)-theme.$($metadata.themeRevision)" >> $env:GITHUB_ENV
      - name: Verify the scanned artifact and publish idempotently
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
        run: ./scripts/publish-release.ps1
